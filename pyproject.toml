[project]
name = "docling-indra-ocr"
version = "0.1.0"
description = "Indra OCR plugin for Docling"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jspast", email = "140563347+jspast@users.noreply.github.com" }]
keywords = ["docling", "plugin"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "indra-ocr >=1.1.2,<2.0.0",
]

[project.urls]
Issues = "https://github.com/jspast/docling-indra-ocr/issues"
Repository = "https://github.com/jspast/docling-indra-ocr"

[project.entry-points.docling]
indra-ocr = "docling_indra_ocr.plugin"

[dependency-groups]
dev = [
  "docling-indra-ocr",
  "docling >=2.66.0,<3.0.0",
  "pytest >=7.0,<10.0",
  "ruff >=0.5.0,<1.0.0",
  "torch >=2.11.0,<3.0.0",
  "torchvision >=0.26.0,<1.0.0",
  "ty >=0.0.65,<1.0.0",
]

[build-system]
requires = ["flit_core >=4,<5"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ty.terminal]
output-format = "concise"

[tool.uv]
package = true
prerelease = "if-necessary"

[tool.uv.sources]
torch = { index = "torch_cpu" }
torchvision = { index = "torch_cpu" }

[[tool.uv.index]]
name = "torch_cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
